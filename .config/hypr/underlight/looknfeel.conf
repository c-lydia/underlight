general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $blue $violet 45deg
    col.inactive_border = rgba(565f8966)
    resize_on_border = true
    extend_border_grab_area = 12
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.98
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(05060cb3)
        offset = 0 5
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0.01
        contrast = 1.05
        brightness = 0.95
        vibrancy = 0.20
        vibrancy_darkness = 0.15
        popups = true
        popups_ignorealpha = 0.20
    }
}

animations {
    enabled = true
    bezier = swift, 0.16, 1, 0.3, 1
    bezier = soft, 0.4, 0, 0.2, 1
    animation = windows, 1, 4, swift, popin 92%
    animation = windowsOut, 1, 3, soft, popin 95%
    animation = border, 1, 5, swift
    animation = fade, 1, 3, soft
    animation = layers, 1, 4, swift, slide
    animation = workspaces, 1, 4, swift, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    precise_mouse_move = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    focus_on_activate = true
}

layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = on
    ignore_alpha = 0.05
}

layerrule {
    name = blur-wofi
    match:namespace = wofi
    blur = on
    ignore_alpha = 0.20
}

layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur = on
    ignore_alpha = 0.20
}

layerrule {
    name = blur-underlight-widgets
    match:namespace = ^underlight-(date|media|system|drives)$
    blur = on
    ignore_alpha = 0.05
}
