$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus --new-window
$browser = firefox
$menu = ~/.local/bin/underlight-menu

# Apps and session controls.
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, R, exec, $menu
bind = $mainMod, X, exec, ~/.local/bin/underlight-control
bind = $mainMod, C, killactive
bind = ALT, F4, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod CTRL, L, exec, loginctl lock-session
bind = $mainMod, M, exec, ~/.local/bin/underlight-power
bind = $mainMod SHIFT, V, exec, ~/.local/bin/underlight-clipboard
bind = $mainMod SHIFT, A, exec, ~/.local/bin/underlight-laptop
bind = $mainMod SHIFT, G, exec, ~/.local/bin/underlight-gpu-menu
bind = $mainMod SHIFT, I, exec, ~/.local/bin/underlight-ai menu
bind = , PRINT, exec, ~/.local/bin/underlight-shot screen
bind = $mainMod SHIFT, S, exec, ~/.local/bin/underlight-shot area

# Minimize to a hidden shelf; open the shelf and press the same key to restore.
bind = $mainMod, N, exec, ~/.local/bin/underlight-minimize
bind = ALT, F9, exec, ~/.local/bin/underlight-minimize
bind = $mainMod SHIFT, N, togglespecialworkspace, minimized

# Focus, rearrange, and resize tiled windows with arrows or vim keys.
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod, D, layoutmsg, togglesplit
bind = $mainMod SHIFT, D, layoutmsg, swapsplit
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

# Workspaces.
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Hardware keys. Optional helpers become active when installed.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, sh -c 'command -v brightnessctl >/dev/null && brightnessctl set 5%+'
bindel = , XF86MonBrightnessDown, exec, sh -c 'command -v brightnessctl >/dev/null && brightnessctl set 5%-'
bindl = , XF86AudioNext, exec, sh -c 'command -v playerctl >/dev/null && playerctl next'
bindl = , XF86AudioPause, exec, sh -c 'command -v playerctl >/dev/null && playerctl play-pause'
bindl = , XF86AudioPlay, exec, sh -c 'command -v playerctl >/dev/null && playerctl play-pause'
bindl = , XF86AudioPrev, exec, sh -c 'command -v playerctl >/dev/null && playerctl previous'
