# Loaded by underlight-glass only after the matching plugin is available.
# HyprGlass v0.2.1 / Hyprland 0.53.3. Keep tint and blur light so refraction shows.
plugin:hyprglass {
    enabled = 1
    default_theme = dark
    default_preset = default
    blur_strength = 0.55
    blur_iterations = 2
    refraction_strength = 0.7
    lens_distortion = 0.0
    chromatic_aberration = 0.0
    fresnel_strength = 0.9
    specular_strength = 1.5
    edge_thickness = 0.035
    glass_opacity = 1.0
    tint_color = 0x7dcfff0c
    brightness = 0.98
    contrast = 1.06
    saturation = 1.08
    adaptive_dim = 0.12
    adaptive_boost = 0.02
}

# Strong native blur erases the sampled image before the glass pass can bend it.
# Keep a light native pass for the bar/launcher; HyprGlass supplies window frost.
decoration {
    blur {
        enabled = true
        size = 2
        passes = 1
    }
}
