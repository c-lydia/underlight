# Export the session so portals and user services can find Hyprland.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP

exec-once = hyprpaper
exec-once = waybar
exec-once = ~/.local/bin/underlight-widgets
exec-once = hypridle
exec-once = sh -c 'command -v mako >/dev/null && exec mako'
exec-once = sh -c 'command -v nm-applet >/dev/null && exec nm-applet --indicator'
exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && exec wl-paste --type text --watch cliphist store'
exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && exec wl-paste --type image --watch cliphist store'
