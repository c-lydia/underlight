# Hybrid Intel/NVIDIA policy.
#
# Hyprland should render the desktop on the automatically selected iGPU. This
# keeps the RTX card available for PRIME render offload without holding it awake
# for the entire session. Run individual heavy applications with:
#
#   underlight-gpu-run COMMAND [ARGUMENT ...]
#
# Do not set LIBVA_DRIVER_NAME or __GLX_VENDOR_LIBRARY_NAME globally here: on a
# hybrid laptop that would force ordinary desktop applications toward NVIDIA.
# `underlight-gpu-run` supplies the NVIDIA variables only to the selected app.
#
# If a monitor wired to NVIDIA fails on a particular driver, the current
# Hyprland workaround can be enabled explicitly after running
# `underlight-gpu-check`:
# env = AQ_FORCE_LINEAR_BLIT,0
