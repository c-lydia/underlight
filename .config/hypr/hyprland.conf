# Underlight: Ubuntu workflow with an Omarchy-inspired Hyprland shell.
# The original stock config is preserved as hyprland.conf.pre-underlight.

source = ~/.config/hypr/underlight/colors.conf
source = ~/.config/hypr/underlight/environment.conf
source = ~/.config/hypr/underlight/gpu.conf
source = ~/.config/hypr/underlight/monitors.conf
source = ~/.config/hypr/underlight/input.conf
source = ~/.config/hypr/underlight/looknfeel.conf
source = ~/.config/hypr/underlight/autostart.conf
source = ~/.config/hypr/underlight/background-apps.conf
source = ~/.config/hypr/underlight/bindings.conf
source = ~/.config/hypr/underlight/rules.conf
