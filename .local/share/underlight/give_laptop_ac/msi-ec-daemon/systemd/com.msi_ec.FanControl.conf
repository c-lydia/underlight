<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="com.msi_ec.FanControl"/>
    <deny send_destination="com.msi_ec.FanControl"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="GetCapabilities"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="GetFirmwareVersion"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="GetModelId"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="ListFanModes"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="ListShiftModes"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="ReadFanMode"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="ReadShiftMode"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="ReadControl"/>
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl" send_member="ReadCurve"/>
  </policy>
  <policy group="msi-ec">
    <allow send_destination="com.msi_ec.FanControl" send_interface="com.msi_ec.FanControl"/>
  </policy>
  <policy user="root">
    <allow own="com.msi_ec.FanControl"/>
    <allow send_destination="com.msi_ec.FanControl"/>
  </policy>
</busconfig>
